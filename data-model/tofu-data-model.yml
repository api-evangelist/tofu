relationships:
- from: person
  to: company
  kind: belongs_to
  via: current_company_domain
  description: >-
    A person's current employer is carried both as a filterable key
    (current_company_domain / current_company_linkedin) and as a returned field
    group (current_company). The domain is the join key into the company entity.
  confidence: high
- from: person
  to: company
  kind: has_many
  via: experience
  description: Full employment history — past employers, each nameable but not
    guaranteed to carry a resolvable company domain.
  confidence: medium
- from: company
  to: person
  kind: has_many
  via: people
  description: Decision-makers and CXOs attached to a company record (capped).
  confidence: high
- from: company
  to: company
  kind: has_many
  via: competitors
  description: Competitor domains (direct + SEO), expressed as domains that resolve
    back into the company entity.
  confidence: high
- from: company
  to: company
  kind: has_many
  via: funding.investors
  description: Investor names on funding rounds. Names only — not guaranteed to
