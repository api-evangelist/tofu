notes: >-
  A two-entity model — company and person — joined on the company domain. Every
  field and filter above is published by the live API at
  /v1/schema/{entity}; nothing here is inferred from prose. Note that field
  selection is billed: requesting `contact` on a person adds 2 credits when an
  email is actually returned, so the field graph doubles as a cost model.
