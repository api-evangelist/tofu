notes: >-
  Tofu publishes no pricing PAGE — tofuhq.com/pricing returns 404 and
  enrich.tofuhq.com carries no price list. The tiers, prices and per-operation
  credit costs above are published verbatim in the GUIDE.md shipped inside the
  first-party @tofuhq/enrich npm package and are also readable at runtime via
  `enrich plans` (GET /v1/billing/plans, which requires an API key). The free tier
  exists but its starter credit allotment is not stated in any published source, so
  it is recorded as unquantified rather than guessed. These prices cover the Enrich
  API only; the core Tofu GTM platform is sold sales-led ("Book A Demo") with no
  published pricing at all.
