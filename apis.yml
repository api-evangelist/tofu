name: Tofu
description: 'Tofu (tofuhq.com) is an agentic go-to-market (GTM) platform that automates
  always-on, integrated marketing and sales campaigns inside a team''s existing GTM
  stack, helping revenue teams ship integrated campaigns dramatically faster. It targets
  outbound prospecting, lead nurturing, event follow-up, sales acceleration, stalled-deal
  re-engagement, and customer expansion, and integrates with major CRM and sales tools
  including Salesforce, HubSpot, Marketo, and Outreach. Tofu is a hosted SaaS product
  backed by Index Ventures; it consumes third-party APIs rather than publishing a public
  developer API, and advertises SOC 2 compliance. No public OpenAPI, SDK, MCP server,
  or /.well-known discovery surface was found during enrichment.'
