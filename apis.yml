name: Tofu
description: 'Tofu (tofuhq.com) is an agentic go-to-market platform for B2B revenue
  teams, running always-on marketing and sales campaigns across email, LinkedIn and
  landing pages inside a team''s existing GTM stack. Three agents — Research, Create
  and Launch — scale 1:1 ABM to hundreds of accounts, covering outbound prospecting,
  lead nurture, event follow-up, sales acceleration, stalled-deal re-engagement and
  customer expansion, and integrating with Salesforce, HubSpot, Marketo, Outreach
  and Salesloft. Tofu also ships a public, self-serve developer product: the Enrich
  API (api.enrich.tofuhq.com), a credit-metered company and people data API covering
  firmographics, funding, headcount, hiring, web traffic, competitors and verified
  business emails. It is deliberately agent-first — the documented interface is a
  first-party CLI (@tofuhq/enrich) driven by a published Agent Skill rather than an
  SDK, and its two schema endpoints answer unauthenticated. Backed by Index Ventures;
  Tofu states it is SOC 2 certified.'
