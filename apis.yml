apis:
- name: Tofu Enrich API
  description: 'Credit-metered company and people data enrichment. Two entities —
    company (keyed on domain or LinkedIn URL) and person (keyed on LinkedIn profile
    URL or business email) — with a structured filter grammar for search and
    group/dotted-path field selection for enrichment. Company records cover
    firmographics, taxonomy, headcount and growth, funding and investors, hiring,
    web traffic, SEO, Glassdoor/G2 ratings, news, decision-makers and competitors;
    person records cover employment history, education, skills, GitHub, social and
    verified business email. Credits are charged per record returned, with no charge
    when nothing matches. Authentication is a bearer API key prefixed enr_,
    provisioned by emailed one-time code through the CLI. No OpenAPI is published,
    but GET /v1/schema/company and GET /v1/schema/person return the complete filter
    and field vocabulary unauthenticated.'
