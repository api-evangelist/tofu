notes: >-
  Tofu's standards posture is split cleanly by surface. Its identity layer
  (login.tofuhq.com) is genuinely standards-conformant — OAuth 2.0 with PKCE,
  RFC 8414 metadata, OIDC discovery and RFC 8628 device authorization, all
  discoverable anonymously. Its A2A agent card is one of the ~15% of published
  cards that actually grade conformant. Its data API (api.enrich.tofuhq.com) is
  not: no OpenAPI, a bespoke error envelope, no standard rate-limit signalling.
  The SOC 2 claim is recorded as claimed-not-verified because the only source is
  Tofu's own llms.txt.
