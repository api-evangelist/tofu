api: https://api.enrich.tofuhq.com
note_on_provenance: >-
  Tofu publishes no OpenAPI. These two endpoints answer UNAUTHENTICATED with the
  complete filter and field vocabulary for each entity, so this model is read
  directly off the live API rather than inferred. The raw responses are saved
  verbatim alongside this file.
entities:
- name: company
  identifiers:
  - field: domain
    description: Primary web domain — the canonical company key.
    primary: true
  - field: linkedin_url
    description: Company LinkedIn URL.
  resolution: >-
    Fuzzy names are not accepted by `get`; they must first be resolved to a domain
    via /v1/identify.
  filters: 14
  filter_fields:
  - {field: name, type: string, ops: ['=', '!=', in, not_in, contains, starts_with]}
